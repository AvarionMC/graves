name: Java

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  java:
    uses: svaningelgem/ci-workflows/.github/workflows/java.yml@v1
    with:
      java-version: '25'
      command: ./gradlew build -x copyToTestServer
